{% extends 'base.html' %}
{% block title %}Ressources Humaines | {{ HOTEL_NAME }}{% endblock %}
{% block page_title %}Gestion du Personnel & RH{% endblock %}

{% block content %}
<div class="glass-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-person-badge-fill text-purple me-2"></i>Employés & Contrats</h4>
    </div>
    <div class="table-responsive">
        <table class="table-glass">
            <thead>
                <tr>
                    <th>Employé</th>
                    <th>Poste / Rôle</th>
                    <th>Service</th>
                    <th>Contrat</th>
                    <th>Téléphone</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">Aucun employé enregistré.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
