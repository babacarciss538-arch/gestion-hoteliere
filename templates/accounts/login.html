{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | {{ HOTEL_NAME }} PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/glassmorphism.css' %}">
</head>
<body class="login-page d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="glass-card login-panel">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="background: rgba(139, 92, 246, 0.15); color: #8B5CF6;">
                <i class="bi bi-building-fill" style="font-size: 2rem;"></i>
            </div>
            <h2 class="fw-bold mb-1" style="font-size: 1.5rem; color: #FFF;">{{ HOTEL_NAME }}</h2>
            <p class="text-muted small">Property Management System (PMS)</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show p-2 small mb-3" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">ADRESSE EMAIL</label>
                {{ form.username }}
            </div>

            <div class="mb-4">
                <label class="form-label small text-secondary fw-semibold">MOT DE PASSE</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold" style="background: linear-gradient(135deg, #8B5CF6, #6D28D9); border: none; border-radius: 8px;">
                <i class="bi bi-box-arrow-in-right me-2"></i> Se Connecter
            </button>
        </form>

        <div class="text-center mt-4 text-muted extra-small" style="font-size: 0.75rem;">
            Accès sécurisé réservé au personnel de l'hôtel.
        </div>
    </div>
</body>
</html>
